services:
  # ── Backend API + Worker (single free web service) ────────────────────────
  # RQ worker runs as a background process inside the same dyno as uvicorn.
  # No separate paid Background Worker needed.
  - type: web
    name: aqia-backend
    runtime: python
    plan: free
    rootDir: aqia
    buildCommand: pip install -r server/requirements.txt
    startCommand: bash server/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        sync: false          # Set manually: your Neon connection string
      - key: REDIS_URL
        sync: false          # Set manually: your Upstash Redis URL
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false          # Set manually: your Vercel URL e.g. https://aqia.vercel.app
      - key: COQUI_TOS_AGREED
        value: "1"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-credentials.json
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render Dashboard
    # Upload google-credentials.json as a Secret File in Render Dashboard
    # Path: /etc/secrets/google-credentials.json
